<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2c1810" />
  <title>Échecs 3D</title>
  <link rel="stylesheet" href="chess-style.css" />
</head>
<body>
  <a href="../" class="home-link" aria-label="Retour à l'accueil">← Accueil</a>

  <div class="container">
    <header>
      <h1>♟ Échecs 3D</h1>
    </header>

    <div class="game-layout">
      <aside class="sidebar left">
        <div class="panel status-panel">
          <h2>Statut</h2>
          <div class="turn-indicator" id="turn-indicator">
            <span class="turn-piece">♔</span>
            <span>Tour des Blancs</span>
          </div>
          <div id="game-status"></div>
        </div>

        <div class="panel captured-panel">
          <h3>Pièces capturées</h3>
          <div class="captured-section">
            <div class="captured-label">Blanches :</div>
            <div class="captured-pieces" id="captured-white"></div>
          </div>
          <div class="captured-section">
            <div class="captured-label">Noires :</div>
            <div class="captured-pieces" id="captured-black"></div>
          </div>
        </div>
      </aside>

      <main class="chess-main">
        <div class="board-controls desktop-only">
          <div class="size-control">
            <label for="board-size">Taille :</label>
            <select id="board-size" class="size-select">
              <option value="520">Petit</option>
              <option value="660" selected>Moyen</option>
              <option value="820">Grand</option>
              <option value="max">Très grand</option>
            </select>
          </div>
        </div>

        <div id="board-stage">
          <div id="chess-container"></div>
          <div id="board-toast" class="board-toast" hidden>Prise en passant !</div>

          <div class="controls-bar">
            <button class="control-btn" id="btn-new-game" aria-label="Nouvelle partie">
              <span>🎮</span> Nouvelle partie
            </button>
            <button class="control-btn" id="btn-undo" aria-label="Annuler le coup" disabled>
              <span>↶</span> Annuler
            </button>
            <button class="control-btn secondary" id="btn-reset-camera" aria-label="Réinitialiser la caméra">
              <span>📷</span> Réinitialiser vue
            </button>
            <button class="control-btn fullscreen-btn" id="btn-fullscreen" aria-label="Plein écran">
              <span>⛶</span> <span id="fullscreen-label">Plein écran</span>
            </button>
          </div>
        </div>
      </main>

      <aside class="sidebar right">
        <div class="panel mode-panel">
          <h2>Mode de jeu</h2>
          <div class="mode-buttons">
            <button class="mode-btn active" data-mode="2player">
              <span>👥</span>
              <div>2 Joueurs</div>
            </button>
            <button class="mode-btn" data-mode="ai">
              <span>🤖</span>
              <div>Contre IA</div>
            </button>
          </div>
          
          <div id="ai-settings" class="ai-settings" style="display: none;">
            <h3>Difficulté IA</h3>
            <select id="ai-difficulty" class="difficulty-select">
              <option value="1">Facile (profondeur 1)</option>
              <option value="2" selected>Moyen (profondeur 2)</option>
              <option value="3">Difficile (profondeur 3)</option>
              <option value="4">Expert (profondeur 4)</option>
            </select>
            
            <div class="ai-color">
              <label>
                <input type="radio" name="ai-color" value="black" checked />
                <span>IA joue Noir</span>
              </label>
              <label>
                <input type="radio" name="ai-color" value="white" />
                <span>IA joue Blanc</span>
              </label>
            </div>
          </div>
        </div>

        <div class="panel moves-panel">
          <h3>Historique des coups</h3>
          <div class="moves-list" id="moves-list"></div>
        </div>
      </aside>
    </div>
  </div>

  <div id="promotion-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <h2>Promotion du pion</h2>
      <p>Choisissez une pièce :</p>
      <div class="promotion-choices" id="promotion-choices"></div>
    </div>
  </div>

  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="chess.min.js"></script>
  <script src="chess-game.js"></script>
</body>
</html>
